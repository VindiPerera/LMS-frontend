name: facetalk_clone
description: "FaceTalk: a language exchange app for students and teachers to talk and learn together."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Firebase: replaces hello-backend (Laravel) entirely. See
  # lib/firebase_options.dart for the one-time project setup this needs.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  # "Continue with Google" on non-web platforms (web uses FirebaseAuth's
  # signInWithPopup directly, no separate package needed there).
  google_sign_in: ^6.2.2
  http: ^1.2.0
  http_parser: ^4.1.0
  # Avatar picking, for backend and storage uploads.
  image_picker: ^1.1.2

  # Add Friend via QR Code: generating/rendering the code, scanning it back,
  # and sharing it. NOTE: intentionally NOT using firebase_dynamic_links —
  # Google shut that service down in August 2025, so it can no longer create
  # or resolve links at all. See lib/services/friend_link_service.dart for
  # what replaces it: hello-backend mints/resolves the short codes now.
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  share_plus: ^10.1.4
  url_launcher: ^6.2.0

  # Deep linking (Android App Links / iOS Universal Links) for the QR/share
  # link flow above — see lib/services/deep_link_service.dart.
  app_links: ^7.2.1
  # Android-only: lets a fresh install recover the invite code that was in
  # the Play Store URL that installed it (Case B "not installed" -> auto-
  # resume on first open). No iOS equivalent exists without a paid service;
  # see deep_link_service.dart for iOS's best-effort clipboard fallback.
  play_install_referrer: ^0.5.0
  # Persists a pending deep link across app restarts between "link tapped"
  # and "finished signing in" (see deep_link_service.dart).
  shared_preferences: ^2.5.5

  # Moments feed: media, formatting, and connectivity/notification support.
  # No state-management package added here on purpose — the rest of the app
  # (auth, chat, friends, connect) is plain StatefulWidget + singleton
  # services, so Moments follows that instead of introducing Riverpod as a
  # one-off pattern. See lib/services/moment_service.dart.
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.5.1
  photo_view: ^0.15.0
  # Playback only — moments can no longer be *created* with a video (see
  # create_moment_screen.dart), but these still render videos on posts that
  # already had one before that changed.
  video_player: ^2.14.0
  chewie: ^1.13.1
  timeago: ^3.7.1
  shimmer: ^3.0.0
  uuid: ^4.6.0
  connectivity_plus: ^7.3.1
  flutter_linkify: ^6.0.0
  flutter_local_notifications: ^22.3.0
  linkify: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# Native (pre-Flutter-engine) splash screen, generated by the
# flutter_native_splash dev dependency above — run
# `dart run flutter_native_splash:create` after editing this and commit the
# generated native files. Fixes the "wrong square logo flashes before our
# real animated splash" bug: without this, Android 12+'s OS-level Splash
# Screen API has nothing to go on and falls back to the raw launcher icon
# (assets/images/facetalk_app_icon.png, a flat gradient square meant for
# the home-screen icon, not a splash) on a plain white background — visibly
# different from screens/auth/splash_screen.dart's actual splash (the same
# icon glyph, no gradient square, on AppColors.background, fading/scaling
# in). This config uses that same icon glyph + background color for the
# native splash on every platform, so the OS splash hands off to the
# Flutter splash without a visible mismatch.
flutter_native_splash:
  color: "#F7F7FA"
  image: assets/images/facetalk_splash_icon.png

  android_12:
    color: "#F7F7FA"
    image: assets/images/facetalk_splash_icon.png

  android: true
  ios: true
  web: false

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
