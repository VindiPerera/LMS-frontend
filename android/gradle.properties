org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler crashes on Windows when the project (here,
# D:\...) and the Flutter pub-cache holding plugin sources (C:\Users\...)
# sit on different drive letters — it tries to compute a relative path
# between the two for its on-disk build cache, which throws
# "IllegalArgumentException: this and base files have different roots"
# (a Kotlin/Gradle bug, not anything in this app's own code). Disabling
# incremental compilation avoids that cache entirely; release builds are
# already non-incremental in spirit, so this costs a bit of rebuild time,
# not correctness.
#
# NOTE: this line has been silently reverted at least twice in past
# sessions (something in this workflow keeps resetting gradle.properties,
# firestore.rules, and a few lib/ files back to older versions — see
# earlier conversation notes). If `flutter run`/`flutter build apk` starts
# failing again with "this and base files have different roots" or
# "Could not close incremental caches", check this file first.
kotlin.incremental=false
